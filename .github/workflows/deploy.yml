name: Publish Advent v Česku
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test collector and public projection
        run: python3 -m unittest discover -s tests -v
      - name: Test JavaScript calendar and regional filtering
        run: node --test tests-ui/helpers.test.mjs tests-ui/pilot.test.mjs
      - name: Validate public files only
        run: python3 scripts/validate_public.py site
      - name: Check browser module syntax
        run: |
          node --check site/app.js
          node --check site/helpers.js
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify-and-upload
    steps:
      - name: Deploy Advent v Česku
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
